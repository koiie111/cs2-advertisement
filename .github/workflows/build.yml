name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check latest stable CounterStrikeSharp
        id: cssharp
        run: python3 .github/scripts/update-cssharp.py

      - name: Plan release
        id: plan
        if: github.event_name != 'schedule' || steps.cssharp.outputs.changed == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_FULL: 'true'
        run: |
          before=""
          if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            before="$BEFORE"
          fi
          bash .github/scripts/plan-release.sh $before | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        if: steps.plan.outputs.mode == 'release'
        with:
          dotnet-version: 10.0.x

      - name: Build and package
        if: steps.plan.outputs.mode == 'release'
        working-directory: Advertisement
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash ../.github/scripts/build.sh

      - name: Run verification
        if: steps.plan.outputs.mode == 'release'
        run: |
          dotnet run --project Tests/PanoramaText.Tests.csproj -c Release -- .
          dotnet run --project Tests/Runtime/Runtime.Tests.csproj -c Release
          python3 Tests/Runtime/analyze.py

      - name: Save verified CounterStrikeSharp update
        if: steps.cssharp.outputs.changed == 'true' && steps.plan.outputs.mode == 'release'
        env:
          CSSHARP_VERSION: ${{ steps.cssharp.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Advertisement/Advertisement.csproj
          git commit -m "build: update CounterStrikeSharp.API to $CSSHARP_VERSION"
          git push origin HEAD:main

      - name: Create release
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          CSSHARP_VERSION: ${{ steps.cssharp.outputs.version }}
        run: |
          gh release create "$TAG" Advertisement/out/Advertisement.zip Advertisement/out/Advertisement-Panorama-Workshop.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Built against CounterStrikeSharp.API $CSSHARP_VERSION." \
            --generate-notes
